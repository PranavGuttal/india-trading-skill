# Copy to config/settings.yaml and edit. Environment variables override this file.
# SAFE DEFAULTS: paper mode, live disabled, human approval required.

trading_mode: paper            # paper | live  (live = the locked `live` desk only; see docs/GROWW_INTEGRATION.md)
live_trading_enabled: false
require_human_approval: true

# Budget enforced by THIS application only. It does not limit your Groww
# account: the rest of your balance stays reachable with the same login.
# Change it any time with `budget set 5000` (or edit here); paper cash and every
# % limit below follow it. 200 is only the starting value.
max_experimental_allocation_inr: 200
max_single_order_pct: 100      # max order = this % of the budget
risk_per_trade_pct: 1          # loss at stop INCLUDING estimated charges, % of budget
daily_loss_pct: 3              # new trades halted for the day after losing this % of budget
# Optional fixed ₹ amounts instead of %. Leave blank so they scale with the budget.
max_single_order_value_inr:
max_risk_per_trade_inr:
daily_loss_limit_inr:
max_open_positions: 1
# Circuit breaker (stricter only). Blank weekly/monthly = 2x / 4x the daily limit.
weekly_loss_limit_inr:
monthly_loss_limit_inr:
max_consecutive_losses: 3      # after this many losing trades in a row...
loss_cooldown_days: 2          # ...no new entries for this many business days
max_trades_per_day: 2
min_reward_risk: 1.5
min_reward_to_cost: 2.0        # planned gross reward must be >= 2x round-trip charges
min_price_inr: 20              # skip penny stocks
max_quote_age_seconds: 120
max_bar_age_days: 5
slippage_bps: 10
product: delivery              # delivery | intraday
regime_gate: index             # index = no NEW entries while Nifty 50 < its 200-day average (tested: fewer losses;
                               # blocks if Nifty data is missing/stale) | watchlist (breadth) | off
# Capital floor: % of the budget that must survive. A new trade is allowed only if
# losing it at its stop (charges incl.) keeps equity above the floor, with open
# positions valued at their stops. Below it: sell everything + kill switch. 0 = off.
capital_floor_pct: 90
# Signal strategy for analyze/scan/autopilot/live: ma_trend_pullback | donchian_trend |
# trend_template | rsi2_reversion  (`strategies` lists them; docs/STRATEGY_LAB.md has results)
strategy: trend_template       # least-losing swing strategy in the lab; none beat buy & hold

allow_short_selling: false     # true is rejected by validation
allow_derivatives: false       # true is rejected by validation
allow_leverage: false          # true is rejected by validation

data_dir: data/sample          # SYNTHETIC sample; after `data-fetch` use data/real
indices_dir: data/indices      # Nifty 50, India VIX, sectors (`data-fetch --indices`)
etf_dir: data/etf              # NIFTYBEES etc. (`data-fetch --etf`)
state_dir: state
watchlist: [SYNTH_TREND, SYNTH_CHOP, SYNTH_LARGE]

# Charges: copied from https://groww.in/pricing on 2026-10-30. Re-verify and
# update as_of before trusting them. Contract notes are the source of truth.
charges:
  source: https://groww.in/pricing
  as_of: "2026-10-30"
  brokerage_pct: 0.001
  brokerage_cap_inr: 20
  brokerage_min_inr: 5
  stt_delivery_pct: 0.001
  stt_intraday_sell_pct: 0.00025
  stamp_delivery_buy_pct: 0.00015
  stamp_intraday_buy_pct: 0.00003
  exchange_txn_pct_nse: 0.0000297
  sebi_turnover_pct: 0.000001
  ipft_pct_nse: 0.000001
  gst_pct: 0.18
  dp_charge_depository_inr: 3.5
  dp_charge_broker_inr: 16.5
  dp_broker_waiver_below_inr: 100
