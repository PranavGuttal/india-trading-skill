[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "india-trading-skill"
version = "0.4.2"
description = "Research, risk-control and paper-trading toolkit for NSE cash equities, with Claude skills. Paper trading only by default."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Pranav D Guttal" }]
# Dependency strategy: lower bounds tested in CI-like runs; pin exact versions
# in your own environment with `pip freeze > requirements.lock` once it works.
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "tzdata>=2024.1",   # zoneinfo needs this on Windows
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
india-trading = "india_trading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
